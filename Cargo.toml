[package]
name = "bilibilive"
version = "0.1.3"
edition = "2024"
rust-version = "1.100"
description = "A native Bilibili streaming studio with CLI, MCP, zuse automation and zgpui"
license = "GPL-3.0-only"
authors = ["LIghtJUNction"]
repository = "https://github.com/LIghtJUNction/bilibilive"
readme = "README.md"
keywords = ["bilibili", "streaming", "mcp", "obs", "project-z"]
categories = ["multimedia::video", "command-line-utilities", "gui"]
include = ["src/**", "tests/**", "examples/**", "docs/**", "scripts/**", "packaging/**", "plugins/**", "rust-toolchain.toml", "Cargo.toml", "Cargo.lock", "README*", "LICENSE", "NOTICE", "CHANGELOG.md"]

[features]
default = ["gui"]
gui = ["zgpui/native", "dep:qrcodegen", "dep:image", "dep:tray-icon"]
linux-software = ["gui", "zgpui/linux-software"]

[dependencies]
zclap = { git = "https://github.com/LIghtJUNction/zclap.git" }
zmcpio = { git = "https://github.com/LIghtJUNction/zmcpio.git", features = ["std"] }
zgpui = { git = "https://github.com/LIghtJUNction/zgpui.git" }
zuse = { package = "zuse-computer", git = "https://github.com/LIghtJUNction/zuse.git" }
zsys = { git = "https://github.com/LIghtJUNction/zsys.git", features = ["dylib"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
semver = "1.0.28"
velopack = { version = "1.2.161", default-features = false, features = ["public-utils"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "rustls", "form", "query", "system-proxy", "gzip", "brotli"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
md5 = "0.8.1"
keyring = "4.2.0"
sha2 = "0.11.1"
hmac = "0.13.0"
base64 = "0.23.1"
getrandom = "0.4.3"
tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
flate2 = "1.1.11"
brotli = "9.1.3"
qrcodegen = { version = "1.8.0", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"], optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace]
