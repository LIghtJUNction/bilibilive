name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish assets to an existing immutable release tag after every native gate succeeds
        required: true
        type: boolean
        default: false
      source_ref:
        description: Branch or commit to validate when publish is false
        required: true
        type: string
        default: main
      release_tag:
        description: Existing release tag when publish is true, for example v0.1.3
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  source:
    name: Freeze validation or release source
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      tag_object: ${{ steps.identity.outputs.tag_object }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.publish && format('refs/tags/{0}', inputs.release_tag) || inputs.source_ref }}
          persist-credentials: false
      - name: Freeze the exact source and validate its release identity
        id: identity
        shell: python
        env:
          REQUESTED_TAG: ${{ inputs.release_tag || github.ref_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          import os, pathlib, re, subprocess, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Native distribution validation requires a stable Cargo version')
          publish = os.environ['PUBLISH'] == 'true'
          tag = os.environ['REQUESTED_TAG'] if publish else 'v' + version
          if tag != 'v' + version:
              raise SystemExit('Release tag must match Cargo.toml')
          commit = subprocess.check_output(['git', 'rev-parse', '--verify', 'HEAD'], text=True).strip()
          tag_object = ''
          if publish:
              reference = 'refs/tags/' + tag
              subprocess.run(['git', 'check-ref-format', reference], check=True)
              tag_object = subprocess.check_output(['git', 'rev-parse', '--verify', reference], text=True).strip()
              tag_commit = subprocess.check_output(['git', 'rev-parse', '--verify', reference + '^{commit}'], text=True).strip()
              if commit != tag_commit:
                  raise SystemExit('Checkout does not match the existing release tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'release_tag={tag}\nsource_sha={commit}\ntag_object={tag_object}\npublish={str(publish).lower()}\n')
          print('Frozen release' if publish else 'Frozen validation source', tag, 'at', commit)

  native:
    name: Native ${{ matrix.platform }}
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - platform: windows-x64
            os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ needs.source.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.source.outputs.source_sha }}
      NATIVE_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out immutable release tooling
        if: runner.os == 'Linux'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Preserve tooling outside the frozen source
        if: runner.os == 'Linux'
        shell: python
        run: |
          import os, pathlib, shutil
          tooling = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bilibilive-release-tools'
          tooling.mkdir()
          for name in ('prepare-cargo-worktrees.py', 'test_prepare_cargo_worktrees.py'):
              shutil.copy2(pathlib.Path('.github/scripts') / name, tooling / name)
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v6.1.0
        if: runner.os != 'Linux'
        with:
          dotnet-version: '10.0.x'
      - name: Install official Velopack packaging tool
        if: runner.os != 'Linux'
        shell: python
        run: |
          import os, pathlib, subprocess
          tools = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bilibilive-vpk'
          subprocess.run(['dotnet', 'tool', 'install', 'vpk', '--version', '1.2.161', '--tool-path', str(tools)], check=True)
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(tools) + '\n')
      - name: Set up isolated Windows media build tools
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2.34.0
        with:
          msystem: UCRT64
          path-type: minimal
          update: true
          install: >-
            make git nasm pkgconf perl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Initialize native Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libfreetype-dev libfontconfig-dev libgl1-mesa-dev cmake ninja-build libobs-dev qt6-base-dev libsimde-dev xvfb ffmpeg
      - name: Install macOS native build dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja meson pkgconf nasm openssl@3
          brew upgrade cmake ninja meson pkgconf nasm openssl@3
      - name: Check version and locked sources
        shell: python
        run: |
          import os, pathlib, subprocess, tomllib
          doc = tomllib.loads(pathlib.Path('Cargo.toml').read_text())
          version = doc['package']['version']
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Release tag must match Cargo.toml')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if commit != os.environ['RELEASE_COMMIT']:
              raise SystemExit('Native build source differs from the frozen release commit')
          host = next(line.split(': ', 1)[1] for line in subprocess.check_output(['rustc', '-vV'], text=True).splitlines() if line.startswith('host:'))
          if host != os.environ['NATIVE_TARGET']:
              raise SystemExit('Native runner architecture differs from its declared target')
          locked = tomllib.loads(pathlib.Path('Cargo.lock').read_text())['package']
          sdk_versions = [package['version'] for package in locked if package['name'] == 'velopack']
          if sdk_versions != ['1.2.161']:
              raise SystemExit('Locked Rust Velopack SDK differs from the verified native packaging tool')
          print('Building bilibilive', version, 'for', host)
          subprocess.run(['cargo', 'metadata', '--locked', '--format-version', '1'],
                         check=True, stdout=subprocess.DEVNULL)
      - name: Validate distribution boundary fixtures
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'packaging', '-p', 'test_installer*.py'], check=True)
          subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'scripts', '-p', 'test_native_runtime.py'], check=True)
      - name: Build and verify the native OBS and media payload
        shell: python
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          import hashlib, json, os, pathlib, subprocess, sys
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          payload = temporary / 'bilibilive-native-payload'
          command = [sys.executable, '-B', 'scripts/prepare-native-runtime.py', '--output', str(payload),
                     '--cache', str(temporary / 'bilibilive-native-cache'), '--target', os.environ['NATIVE_TARGET'], '--jobs', '3']
          if os.name == 'nt':
              command.extend(['--msys2-root', os.environ['MSYS2_ROOT']])
          subprocess.run(command, check=True)
          manifest = payload / 'bundle-manifest.json'
          data = manifest.read_bytes()
          if json.loads(data)['target'] != os.environ['NATIVE_TARGET']:
              raise SystemExit('Native payload target differs from the build')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('BILIBILIVE_NATIVE_PAYLOAD=' + str(payload) + '\n')
              output.write('BILIBILIVE_BUNDLE_MANIFEST_SHA256=' + hashlib.sha256(data).hexdigest() + '\n')
      - name: Validate native build
        shell: python
        run: |
          import subprocess
          for command in (
              ['cargo', 'test', '--locked'],
              ['cargo', 'check', '--locked', '--no-default-features'],
              ['cargo', 'build', '--release', '--locked'],
          ):
              print('+', ' '.join(command), flush=True)
              subprocess.run(command, check=True)
      - name: Build installers and verify installed native GUI and payloads
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          executable = pathlib.Path('target/release') / ('bilibilive.exe' if os.name == 'nt' else 'bilibilive')
          subprocess.run([sys.executable, '-B', 'packaging/installer.py', '--binary', str(executable.resolve()),
                         '--payload', os.environ['BILIBILIVE_NATIVE_PAYLOAD'], '--target', os.environ['NATIVE_TARGET'],
                         '--work', str(temporary / 'bilibilive-installer-work'), '--output', str(pathlib.Path('dist').resolve())], check=True)
      - name: Verify the official download apply and restart lifecycle in a private installation
        if: runner.os != 'Linux'
        shell: python
        run: |
          import os, pathlib, shutil, subprocess, sys, tomllib
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bilibilive-update-probe'
          receipt = work / 'verification.json'
          subprocess.run([sys.executable, '-B', 'packaging/installer_update_probe.py', '--work', str(work),
                         '--target', os.environ['NATIVE_TARGET'], '--output', str(receipt)], check=True)
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          shutil.copy2(receipt, pathlib.Path('dist') / f"bilibilive-v{version}-{os.environ['NATIVE_TARGET']}-update-probe.json")
      - name: Prepare exact Git worktrees for registry verification
        if: runner.os == 'Linux'
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          tooling = temporary / 'bilibilive-release-tools'
          subprocess.run([sys.executable, str(tooling / 'test_prepare_cargo_worktrees.py')], check=True)
          base = pathlib.Path(os.environ.get('CARGO_HOME', str(pathlib.Path.home() / '.cargo')))
          subprocess.run([
              sys.executable, str(tooling / 'prepare-cargo-worktrees.py'),
              '--source', str(pathlib.Path.cwd()), '--base-cargo-home', str(base),
              '--output', str(temporary / 'bilibilive-worktree-cargo'),
              '--receipt', str(temporary / 'bilibilive-worktree-cargo.json'),
              '--github-env', os.environ['GITHUB_ENV'],
          ], check=True)
      - name: Verify and package the registry source projection
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          python -m unittest discover -s scripts -p test_prepare_release.py
          python scripts/prepare-release.py --output "$RUNNER_TEMP/bilibilive-registry"
          python - <<'PY'
          import os, pathlib, shutil, tarfile, tomllib
          root = pathlib.Path.cwd()
          version = tomllib.loads((root / 'Cargo.toml').read_text())['package']['version']
          stage = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bilibilive-registry'
          dist = root / 'dist'
          dist.mkdir(exist_ok=True)
          shutil.copy2(root / f'target/package/bilibilive-{version}.crate', dist)
          shutil.copy2(stage / 'release-provenance.json', dist / f'bilibilive-v{version}-release-provenance.json')
          with tarfile.open(dist / f'bilibilive-v{version}-registry-source.tar.gz', 'w:gz') as archive:
              archive.add(stage, arcname=f'bilibilive-{version}')
          PY
      - name: Record the complete publication asset set
        shell: python
        run: |
          import hashlib, json, os, pathlib, tomllib
          root = pathlib.Path.cwd()
          version = tomllib.loads((root / 'Cargo.toml').read_text())['package']['version']
          output = root / 'dist'
          def sha256(path):
              result = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      result.update(block)
              return result.hexdigest()
          files = sorted(p for p in output.iterdir() if p.is_file() and not p.name.endswith('.sha256'))
          index = {'schema': 1, 'version': version, 'source_commit': os.environ['RELEASE_COMMIT'],
                   'target': os.environ['NATIVE_TARGET'], 'publish': '${{ needs.source.outputs.publish }}' == 'true',
                   'assets': [{'name': p.name, 'size': p.stat().st_size, 'sha256': sha256(p)} for p in files]}
          index_path = output / f"bilibilive-v{version}-{os.environ['NATIVE_TARGET']}-assets.json"
          index_path.write_text(json.dumps(index, indent=2) + '\n', encoding='utf-8')
          for path in files + [index_path]:
              path.with_name(path.name + '.sha256').write_text(sha256(path) + '  ' + path.name + '\n', encoding='ascii')
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bilibilive-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Preserve native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bilibilive-${{ matrix.platform }}-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bilibilive-native-cache/preparation-*.json
            ${{ runner.temp }}/bilibilive-native-cache/logs/**/*.log
            ${{ runner.temp }}/bilibilive-update-probe/verification.json
            ${{ runner.temp }}/bilibilive-update-probe/logs/*.log
            dist/*-smoke*.json
            dist/*-verification.json
          if-no-files-found: ignore
          retention-days: 14

  publish-assets:
    if: needs.native.result == 'success' && needs.source.outputs.publish == 'true'
    needs: [source, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.source.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.source.outputs.source_sha }}
      RELEASE_TAG_OBJECT: ${{ needs.source.outputs.tag_object }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          persist-credentials: false
      - name: Verify the public tag has not changed
        shell: python
        run: |
          import os, subprocess
          reference = 'refs/tags/' + os.environ['RELEASE_TAG']
          output = subprocess.check_output(
              ['git', 'ls-remote', '--tags', 'origin', reference, reference + '^{}'], text=True)
          references = {}
          for line in output.splitlines():
              sha, name = line.split()
              references[name] = sha
          if references.get(reference) != os.environ['RELEASE_TAG_OBJECT']:
              raise SystemExit('Public release tag changed after source validation')
          commit = references.get(reference + '^{}', references.get(reference))
          if commit != os.environ['RELEASE_COMMIT']:
              raise SystemExit('Public release tag no longer identifies the tested source')
          print('Verified release tag still identifies', commit)
      - uses: actions/download-artifact@v8.0.2
        with:
          name: bilibilive-linux-x64
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          name: bilibilive-windows-x64
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          name: bilibilive-macos-arm64
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          name: bilibilive-macos-x64
          path: dist
      - name: Verify the four complete asset sets before publication
        shell: python
        run: |
          import hashlib, json, os, pathlib, re
          root = pathlib.Path('dist')
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          expected = set()
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          def digest(path):
              value = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      value.update(block)
              return value.hexdigest()
          def add_file(name, size, checksum):
              require(isinstance(name, str) and re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]*', name), 'Unsafe release asset name')
              require(name not in expected and name + '.sha256' not in expected, 'Duplicate asset across native manifests')
              require(type(size) is int and size >= 0 and isinstance(checksum, str) and re.fullmatch(r'[0-9a-f]{64}', checksum), 'Invalid asset digest or size')
              path, sidecar = root / name, root / (name + '.sha256')
              require(path.is_file() and not path.is_symlink() and path.stat().st_size == size and digest(path) == checksum, 'Asset differs from the successful native build: ' + name)
              require(sidecar.is_file() and not sidecar.is_symlink() and sidecar.stat().st_size <= 1024, 'Missing asset checksum: ' + name)
              require(sidecar.read_text(encoding='ascii') == checksum + '  ' + name + '\n', 'Asset checksum sidecar differs: ' + name)
              expected.update((name, name + '.sha256'))
          for target in ('x86_64-unknown-linux-gnu', 'x86_64-pc-windows-msvc', 'aarch64-apple-darwin', 'x86_64-apple-darwin'):
              name = f'bilibilive-v{version}-{target}-assets.json'
              path = root / name
              require(path.is_file() and not path.is_symlink() and path.stat().st_size <= 4 * 1024 * 1024, 'Missing native asset manifest: ' + target)
              index = json.loads(path.read_text(encoding='utf-8'))
              require((index.get('schema'), index.get('version'), index.get('source_commit'), index.get('target')) == (1, version, os.environ['RELEASE_COMMIT'], target) and index.get('publish') is True, 'Native asset manifest belongs to a different source or validation run')
              records = index.get('assets')
              require(isinstance(records, list) and 0 < len(records) <= 128, 'Invalid native asset list')
              for record in records:
                  add_file(record['name'], record['size'], record['sha256'])
              add_file(name, path.stat().st_size, digest(path))
          actual = list(root.iterdir())
          require(all(path.is_file() and not path.is_symlink() for path in actual) and {path.name for path in actual} == expected, 'Unexpected asset outside the four verified native manifests')
          print('Verified', len(expected), 'asset and checksum files from', os.environ['RELEASE_COMMIT'])
      - uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ needs.source.outputs.release_tag }}
          target_commitish: ${{ needs.source.outputs.source_sha }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
