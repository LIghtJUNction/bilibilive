name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  source:
    name: Freeze release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      tag_object: ${{ steps.identity.outputs.tag_object }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ format('refs/tags/{0}', inputs.release_tag || github.ref_name) }}
          persist-credentials: false
      - name: Verify tag and freeze its source commit
        id: identity
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          import os, pathlib, subprocess, tomllib
          tag = os.environ['RELEASE_TAG']
          reference = 'refs/tags/' + tag
          subprocess.run(['git', 'check-ref-format', reference], check=True)
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          if tag != 'v' + version:
              raise SystemExit('Release tag must match Cargo.toml')
          commit = subprocess.check_output(['git', 'rev-parse', '--verify', 'HEAD'], text=True).strip()
          tag_object = subprocess.check_output(['git', 'rev-parse', '--verify', reference], text=True).strip()
          tag_commit = subprocess.check_output(['git', 'rev-parse', '--verify', reference + '^{commit}'], text=True).strip()
          if commit != tag_commit:
              raise SystemExit('Checkout does not match the requested release tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'release_tag={tag}\nsource_sha={commit}\ntag_object={tag_object}\n')
          print('Frozen release', tag, 'at', commit)

  native:
    name: Native ${{ matrix.platform }}
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.source.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.source.outputs.source_sha }}
    steps:
      - name: Check out immutable release tooling
        if: runner.os == 'Linux'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Preserve tooling outside the frozen source
        if: runner.os == 'Linux'
        shell: python
        run: |
          import os, pathlib, shutil
          tooling = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bilibilive-release-tools'
          tooling.mkdir()
          for name in ('prepare-cargo-worktrees.py', 'test_prepare_cargo_worktrees.py'):
              shutil.copy2(pathlib.Path('.github/scripts') / name, tooling / name)
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Initialize native Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libfreetype-dev libfontconfig-dev libgl1-mesa-dev cmake ninja-build libobs-dev qt6-base-dev libsimde-dev xvfb
      - name: Check version and locked sources
        shell: python
        run: |
          import os, pathlib, subprocess, tomllib
          doc = tomllib.loads(pathlib.Path('Cargo.toml').read_text())
          version = doc['package']['version']
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Release tag must match Cargo.toml')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if commit != os.environ['RELEASE_COMMIT']:
              raise SystemExit('Native build source differs from the frozen release commit')
          print('Building bilibilive', version)
          subprocess.run(['cargo', 'metadata', '--locked', '--format-version', '1'],
                         check=True, stdout=subprocess.DEVNULL)
      - name: Validate native build
        shell: python
        run: |
          import subprocess
          for command in (
              ['cargo', 'test', '--locked'],
              ['cargo', 'check', '--locked', '--no-default-features'],
              ['cargo', 'build', '--release', '--locked'],
          ):
              print('+', ' '.join(command), flush=True)
              subprocess.run(command, check=True)
      - name: Build Linux OBS plugin
        if: runner.os == 'Linux'
        run: |
          cmake -S plugins/obs-bilibilive-pk -B build/obs-plugin -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/obs-plugin --parallel 2
      - name: Exercise the native Linux window
        if: runner.os == 'Linux'
        env:
          BILIBILIVE_GUI_FRAMES: '12'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a target/release/bilibilive gui --demo
      - name: Prepare exact Git worktrees for registry verification
        if: runner.os == 'Linux'
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          tooling = temporary / 'bilibilive-release-tools'
          subprocess.run([sys.executable, str(tooling / 'test_prepare_cargo_worktrees.py')], check=True)
          base = pathlib.Path(os.environ.get('CARGO_HOME', str(pathlib.Path.home() / '.cargo')))
          subprocess.run([
              sys.executable, str(tooling / 'prepare-cargo-worktrees.py'),
              '--source', str(pathlib.Path.cwd()), '--base-cargo-home', str(base),
              '--output', str(temporary / 'bilibilive-worktree-cargo'),
              '--receipt', str(temporary / 'bilibilive-worktree-cargo.json'),
              '--github-env', os.environ['GITHUB_ENV'],
          ], check=True)
      - name: Verify and package the registry source projection
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          python scripts/prepare-release.py --output "$RUNNER_TEMP/bilibilive-registry"
          python - <<'PY'
          import os, pathlib, shutil, tarfile, tomllib
          root = pathlib.Path.cwd()
          version = tomllib.loads((root / 'Cargo.toml').read_text())['package']['version']
          stage = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bilibilive-registry'
          dist = root / 'dist'
          dist.mkdir(exist_ok=True)
          shutil.copy2(root / f'target/package/bilibilive-{version}.crate', dist)
          shutil.copy2(stage / 'release-provenance.json', dist / f'bilibilive-v{version}-release-provenance.json')
          with tarfile.open(dist / f'bilibilive-v{version}-registry-source.tar.gz', 'w:gz') as archive:
              archive.add(stage, arcname=f'bilibilive-{version}')
          PY
      - name: Package release assets
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, shutil, subprocess, tarfile, tomllib, zipfile
          root = pathlib.Path.cwd()
          version = tomllib.loads((root / 'Cargo.toml').read_text())['package']['version']
          host = next(line.split(': ', 1)[1] for line in subprocess.check_output(['rustc', '-vV'], text=True).splitlines() if line.startswith('host:'))
          name = f'bilibilive-v{version}-{host}'
          folder = root / 'dist' / name
          folder.mkdir(parents=True)
          executable = 'bilibilive.exe' if os.name == 'nt' else 'bilibilive'
          shutil.copy2(root / 'target/release' / executable, folder / executable)
          for filename in ('LICENSE', 'NOTICE', 'README.md'):
              shutil.copy2(root / filename, folder / filename)
          if os.name != 'nt':
              shutil.copy2(root / 'packaging/bilibilive.1', folder / 'bilibilive.1')
          plugin = root / 'build/obs-plugin/obs-bilibilive-pk.so'
          if plugin.is_file():
              shutil.copy2(plugin, folder / plugin.name)
          if os.name == 'nt':
              archive = root / 'dist' / (name + '.zip')
              with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as out:
                  for file in folder.rglob('*'):
                      if file.is_file(): out.write(file, file.relative_to(folder.parent))
          else:
              archive = root / 'dist' / (name + '.tar.gz')
              with tarfile.open(archive, 'w:gz') as out: out.add(folder, arcname=name)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_name(archive.name + '.sha256').write_text(digest + '  ' + archive.name + '\n')
          print(archive)
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bilibilive-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/*.crate
            dist/*provenance.json
          if-no-files-found: error
          retention-days: 14

  publish-assets:
    if: needs.native.result == 'success'
    needs: [source, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.source.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.source.outputs.source_sha }}
      RELEASE_TAG_OBJECT: ${{ needs.source.outputs.tag_object }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          persist-credentials: false
      - name: Verify the public tag has not changed
        shell: python
        run: |
          import os, subprocess
          reference = 'refs/tags/' + os.environ['RELEASE_TAG']
          output = subprocess.check_output(
              ['git', 'ls-remote', '--tags', 'origin', reference, reference + '^{}'], text=True)
          references = {}
          for line in output.splitlines():
              sha, name = line.split()
              references[name] = sha
          if references.get(reference) != os.environ['RELEASE_TAG_OBJECT']:
              raise SystemExit('Public release tag changed after source validation')
          commit = references.get(reference + '^{}', references.get(reference))
          if commit != os.environ['RELEASE_COMMIT']:
              raise SystemExit('Public release tag no longer identifies the tested source')
          print('Verified release tag still identifies', commit)
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: bilibilive-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ needs.source.outputs.release_tag }}
          target_commitish: ${{ needs.source.outputs.source_sha }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
